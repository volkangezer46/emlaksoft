<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EmlakSoft İlan Kontrol</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      body { margin: 0; width: 320px; color: #0f172a; background: #ffffff; }
      main { padding: 16px; }
      h1 { margin: 0 0 4px; font-size: 15px; }
      .muted { color: #475569; font-size: 12px; }
      .row { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid #e2e8f0; font-size: 13px; }
      .row strong { font-variant-numeric: tabular-nums; }
      .state { margin: 10px 0; padding: 8px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; background: #f1f5f9; }
      .state.ok { background: #ecfdf5; color: #065f46; }
      .state.warn { background: #fffbeb; color: #92400e; }
      button { width: 100%; margin-top: 10px; padding: 9px 12px; border: 0; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; background: #1e3a8a; color: #fff; }
      button.secondary { background: #e2e8f0; color: #0f172a; }
      button:focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; }
      p.legal { margin: 12px 0 0; font-size: 11px; line-height: 1.45; color: #475569; }
    </style>
  </head>
  <body>
    <main>
      <h1>EmlakSoft İlan Kontrol</h1>
      <p class="muted" id="version"></p>
      <div class="state" id="state" role="status">Yükleniyor…</div>
      <div class="row"><span>Bugünkü kontrol</span><strong id="today">-</strong></div>
      <div class="row"><span>Son kontrol</span><strong id="last">-</strong></div>
      <button type="button" id="toggle">Duraklat</button>
      <button type="button" id="help" class="secondary">Kurulum ve bilgi</button>
      <p class="legal" id="legal"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
