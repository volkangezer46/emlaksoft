name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  type-check:
    name: Type check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Sürüm .nvmrc'den okunur — tek doğruluk kaynağı. Burada sabit bir
          # numara yazmak CI ile yerel geliştirmenin ayrışmasına yol açıyordu.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        # --max-warnings=0: uyari birikmesini engeller. Bilincli istisnalar
        # kod icinde gerekceli eslint-disable ile isaretli.
        run: npx eslint . --max-warnings=0

      - name: Testler
        run: npm test

      - name: Server Action yetki kapısı denetimi
        # DB'ye gitmez, statik tarama — CI'da güvenle koşar.
        # Yeni bir action eklenip yetki kapısı unutulursa burada kırılır.
        run: npm run audit:actions

      - name: Bağımlılık açığı kapısı
        # ARTIK BLOKLUYOR. `continue-on-error` kaldırıldı.
        #
        # Düz `npm audit --audit-level=high` CI'ı KALICI KIRMIZI yapardı ve
        # kırmızı bir CI hiçbir şey söylemez — herkes görmezden gelir. Sebep:
        #   npm audit            -> 12 high
        #   npm audit --omit=dev ->  3 high
        # 9'u dev-only (eslint zinciri), 3'ü Next'in KENDI ic bagimliliklarinda
        # (postcss, sharp) ve npm'in onerdigi "fix" Next 16 -> 9.3.3 dusurmek.
        #
        # Kapı bu 3'ü GEREKÇESİYLE bekletiyor, geri kalan her yeni high/critical
        # açıkta CI'ı kırıyor. İstisna listesi scripts/audit-gate.ts içinde.
        run: npm run audit:deps

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          NEXT_PUBLIC_APP_URL: https://placeholder.emlaksoft.com.tr
