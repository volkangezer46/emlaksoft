name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  type-check:
    name: Type check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Sürüm .nvmrc'den okunur — tek doğruluk kaynağı. Burada sabit bir
          # numara yazmak CI ile yerel geliştirmenin ayrışmasına yol açıyordu.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        # --max-warnings=0: uyari birikmesini engeller. Bilincli istisnalar
        # kod icinde gerekceli eslint-disable ile isaretli.
        run: npx eslint . --max-warnings=0

      - name: Güvenlik denetimi (yalnızca çalışma zamanı bağımlılıkları)
        # --omit=dev bilinçli: ESLint zincirindeki dev-only aciklar (minimatch/
        # brace-expansion DoS) production'a gitmiyor ve bunlari zorla yukseltmek
        # linter'i bozuyor. Bu kapi production'a giden koda odaklanir.
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          NEXT_PUBLIC_APP_URL: https://placeholder.emlaksoft.com.tr
