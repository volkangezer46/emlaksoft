title = "EmlakSoft secret scanning"

[extend]
useDefault = true

[[rules]]
id = "database-connection-url"
description = "Database connection URL assigned in an environment file"
regex = '''(?i)DATABASE(_POOLER)?_URL[ \t]*=[ \t]*["']?([^[:space:]"'#]+)'''
secretGroup = 2
keywords = ["DATABASE_URL", "DATABASE_POOLER_URL"]
