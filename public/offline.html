<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Çevrimdışısın — EmlakSoft</title>
<style>
  /* Bağımsız sayfa: harici kaynak yok, marka renkleri globals.css ile aynı */
  :root {
    --canvas: #f6f8fc;
    --ink-950: #071a38;
    --brand-600: #1463ff;
    --mint-500: #10b9a3;
    --cyan-400: #22d3ee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--canvas);
    color: var(--ink-950);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
    text-align: center;
  }
  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto;
    display: block;
    border-radius: 18px;
    background: linear-gradient(120deg, var(--brand-600), var(--cyan-400) 55%, var(--mint-500));
    box-shadow: 0 18px 40px -18px rgba(20, 99, 255, 0.55);
  }
  h1 { margin-top: 22px; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  p { margin-top: 10px; font-size: 14px; line-height: 1.6; color: rgba(7, 26, 56, 0.6); }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 6px;
    border-radius: 50%;
    background: #f59e0b;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .badge {
    margin-top: 22px;
    display: inline-flex;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
    color: rgba(7, 26, 56, 0.55);
    border: 1px solid rgba(7, 26, 56, 0.1);
    background: #fff;
    border-radius: 999px;
    padding: 8px 14px;
  }
  .brand { margin-top: 26px; font-size: 11px; color: rgba(7, 26, 56, 0.4); }
  .brand strong { color: var(--brand-600); }
</style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="EmlakSoft logosu">
      <!-- Marka "E" harfi — gradyan zemin CSS'te -->
      <path d="M22 18h22v6H29v7h13v6H29v9h15v6H22V18z" fill="#ffffff" />
    </svg>
    <h1>Çevrimdışısın</h1>
    <p>
      İnternet bağlantısı yok — bağlantı gelince<br />
      bu sayfa otomatik yenilenir.
    </p>
    <span class="badge"><span class="dot"></span>Bağlantı bekleniyor…</span>
    <p class="brand"><strong>EmlakSoft</strong> — Türkiye&#39;nin emlak işletim sistemi</p>
  </main>
  <script>
    // Bağlantı geri gelince otomatik yenile
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
