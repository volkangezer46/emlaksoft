# EmlakSoft uygulaması (Hetzner). Coolify'ın Traefik'i (coolify-proxy) etiketlerle yönlendirir,
# Let's Encrypt sertifikası `letsencrypt` çözücüsüyle otomatik alınır/yenilenir.
# Yayın: scripts/sunucu/deploy.sh
name: emlaksoft
# SK1/B043 kesintisiz yayın (mavi/yeşil): `app` (mavi, emlaksoft-app) kalıcı konteynerdir; `app-green` (yeşil,
# emlaksoft-app-green, profil "green") YALNIZ yayın sırasında açılır. İkisi aynı Traefik servisine (`emlaksoft`) bağlanır
# (etiketler ortak çapadan, birebir aynı). Traefik sağlıksız/başlayan konteyneri havuza almaz (Docker HEALTHCHECK) ve
# her sunucuyu /api/health ile yoklar (loadbalancer.healthcheck): boşaltılan renk (/tmp/emlaksoft-drain) 503 döner,
# havuzdan çıkar, açık istekleri biter. Akış scripts/sunucu/deploy.sh: yeşil yeni imajla açılır → sağlıklı → mavi
# boşaltılıp yeni imajla yeniden kurulur → sağlıklı → yeşil boşaltılıp durdurulur. Yeşil sağlıklı olmazsa mavi
# hiç kapanmamıştır (geri dönüş = eski rengin yayında kalması). İç ağdan `emlaksoft-app` adı her iki renge de çözülür.
x-app: &app
  restart: unless-stopped
  env_file: ../.env.production
  environment:
    # V8 yığını konteyner sınırının altında kalsın (OOM öldürmesi yerine GC baskısı).
    NODE_OPTIONS: --max-old-space-size=1536
  # Bellek sınırı (takas yok): sızıntı sunucudaki Supabase/Coolify'ı aç bırakmasın.
  mem_limit: 2g
  memswap_limit: 2g
  # SK1/B042: CPU çekişmesinde uygulama, kapı/ajan süreçlerinden (varsayılan 1024) iki kat pay alır.
  cpu_shares: 2048
  # SIGTERM sonrası açık istekler bitsin (varsayılan 10 sn).
  stop_grace_period: 20s
  # Yayınlar arası korunan statik parçalar (scripts/sunucu/deploy.sh doldurur; açık sekmelerde ChunkLoadError önlenir).
  volumes:
    - /srv/emlaksoft/next-static:/app/.next/static:ro
  networks:
    coolify:
      aliases: [emlaksoft-app]
  labels: &app-labels
    traefik.enable: "true"
    traefik.docker.network: coolify
    traefik.http.services.emlaksoft.loadbalancer.server.port: "3000"
    # Sağlık yoklaması: boşaltılan ya da hazır olmayan (DB/migration) sunucu havuzdan çıkar.
    traefik.http.services.emlaksoft.loadbalancer.healthcheck.path: /api/health
    traefik.http.services.emlaksoft.loadbalancer.healthcheck.interval: 2s
    traefik.http.services.emlaksoft.loadbalancer.healthcheck.timeout: 2s
    # HTTP → HTTPS
    traefik.http.middlewares.emlaksoft-https.redirectscheme.scheme: https
    traefik.http.middlewares.emlaksoft-https.redirectscheme.permanent: "true"
    traefik.http.routers.emlaksoft-http.entrypoints: http
    traefik.http.routers.emlaksoft-http.rule: Host(`emlaksoft.com.tr`) || Host(`www.emlaksoft.com.tr`)
    traefik.http.routers.emlaksoft-http.middlewares: emlaksoft-https
    traefik.http.routers.emlaksoft-http.service: emlaksoft
    # www → kök alan adı (kalıcı)
    traefik.http.middlewares.emlaksoft-www.redirectregex.regex: ^https://www\.emlaksoft\.com\.tr/(.*)
    traefik.http.middlewares.emlaksoft-www.redirectregex.replacement: https://emlaksoft.com.tr/$${1}
    traefik.http.middlewares.emlaksoft-www.redirectregex.permanent: "true"
    traefik.http.middlewares.emlaksoft-gzip.compress: "true"
    # SK1/B050: Accept-Encoding br ile brotli (Traefik v3.7), yoksa gzip.
    traefik.http.middlewares.emlaksoft-gzip.compress.encodings: br,gzip
    # Next 16 proxy rewrite'ında x-middleware-rewrite başlığını istemci yanıtına kendisi yazar (resolve-routes);
    # uygulamadan silmek rewrite'ı bozar, bu yüzden dış yanıttan vekilde silinir (boş değer = başlığı kaldır).
    traefik.http.middlewares.emlaksoft-strip.headers.customresponseheaders.X-Middleware-Rewrite: ""
    traefik.http.routers.emlaksoft.entrypoints: https
    traefik.http.routers.emlaksoft.rule: Host(`emlaksoft.com.tr`) || Host(`www.emlaksoft.com.tr`)
    traefik.http.routers.emlaksoft.middlewares: emlaksoft-www,emlaksoft-strip,emlaksoft-gzip
    traefik.http.routers.emlaksoft.service: emlaksoft
    traefik.http.routers.emlaksoft.tls: "true"
    traefik.http.routers.emlaksoft.tls.certresolver: letsencrypt
    traefik.http.routers.emlaksoft.tls.domains[0].main: emlaksoft.com.tr
    traefik.http.routers.emlaksoft.tls.domains[0].sans: www.emlaksoft.com.tr
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
services:
  app:
    <<: *app
    image: emlaksoft-app:${APP_TAG:-latest}
    container_name: emlaksoft-app
  app-green:
    <<: *app
    profiles: ["green"]
    image: emlaksoft-app:${GREEN_TAG:-latest}
    container_name: emlaksoft-app-green
  # /_next/static: önceden sıkıştırılmış (brotli q11 / gzip -9) dosyaları doğrudan sunar
  # (scripts/sunucu/precompress-static.mjs üretir). Uygulama konteyneri bu yolu yine sunabilir; Traefik yalnız
  # bu yolu daha yüksek öncelikle buraya verir.
  static:
    # 2.10.2 önceden sıkıştırılmış yanıtı Range isteği olmadan 206 döndürüyor; 2.10.0 doğru (200).
    image: caddy:2.10.0-alpine
    container_name: emlaksoft-static
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    volumes:
      - /srv/emlaksoft/next-static:/srv/static:ro
      - ./Caddyfile.static:/etc/caddy/Caddyfile:ro
    tmpfs: [/data, /config]
    networks: [coolify]
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.services.emlaksoft-static.loadbalancer.server.port: "8080"
      traefik.http.routers.emlaksoft-static.entrypoints: https
      traefik.http.routers.emlaksoft-static.rule: (Host(`emlaksoft.com.tr`) || Host(`www.emlaksoft.com.tr`)) && PathPrefix(`/_next/static/`)
      traefik.http.routers.emlaksoft-static.priority: "1000"
      traefik.http.routers.emlaksoft-static.service: emlaksoft-static
      traefik.http.routers.emlaksoft-static.tls: "true"
      traefik.http.routers.emlaksoft-static.tls.certresolver: letsencrypt
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  # EİDS posta alıcısı (EP3): yalnız eids.emlaksoft.com.tr için GELEN posta (röle yok, giden posta yok).
  # PROFİLLİ: deploy.sh'nin `up -d` çağrısı bunu BAŞLATMAZ; kurulum ve güncelleme scripts/sunucu/install-eids-inbound.sh
  # ile yapılır (DNS MX + Hetzner güvenlik duvarında TCP 25 açıldıktan sonra). Uygulamaya iç ağdan HMAC imzalı POST eder.
  eids-inbound:
    profiles: ["eids"]
    image: emlaksoft-eids-inbound:${EIDS_TAG:-latest}
    container_name: emlaksoft-eids-inbound
    restart: unless-stopped
    # Yalnız köprü anahtarı (EIDS_INBOUND_SECRET) — uygulamanın diğer sırları bu konteynere VERİLMEZ.
    env_file: /srv/emlaksoft/eids-inbound.env
    environment:
      EIDS_APP_URL: http://emlaksoft-app:3000/api/inbound/eids
      EIDS_SMTP_PORT: "2525"
      EIDS_MTA_NAME: mx.emlaksoft.com.tr
    ports:
      - "25:2525"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    memswap_limit: 192m
    networks: [coolify]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  coolify:
    external: true
